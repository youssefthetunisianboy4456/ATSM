<style>
	.overall-div {
		background-color: rgb(17, 77, 167);
		display : grid;
		grid-template-columns: auto;
	}
	.overall-div div{
		color: white;
		text-align: center;
	}
	.ATSM1 {
		font-weight: bold;
		font-size: 40px/*55px*/;
		/*font-family: 'Times New Roman', Times, serif;*/
	}
	.ATSM2{
		font-weight: 0;
		font-size: 25px;
	}
	.ATSM3{
		font-size: 25px;
		background-color: red;
		width: 25%;
		margin-left: 37.5%;

		margin-bottom: 10px;
		border-radius: 5px;
	} 
	.ATSM3 a{
		color: white;
		text-decoration-line: none;
	} 
	.annonces{
		display: grid;
		grid-template-columns: auto;
		width: 100%;
	}
	.annonces div{
		text-align: center;
		width: 100%;
	}
	.annonce {
		border : 0.1px solid rgb(150, 143, 143);
	}
	.annonce-titre{
		font-size: 30px;
		font-weight: bold;
	}
	.annonce-main-text{
		font-size: 20px;
	}
	.all-annonces{
		color: blue;
		text-decoration: underline; 
	}
	.annonce-image{
		padding-top: 10px;
		width : 600px;
		border-radius: 15px;
	} 
</style>

<script>
	function toggleMenu() {
		const menuToggle = document.getElementById("menuToggle");
		const navLinks = document.querySelector(".nav-links");
		navLinks.classList.toggle("active");

		if (navLinks.classList.contains("active")) {
			menuToggle.textContent = "✕";
		} else {
			menuToggle.textContent = "☰";
		}
	};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

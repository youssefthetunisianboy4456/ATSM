<!DOCTYPE html>
<html>
<head>
	<title>Modifier une annonce</title>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
</head>
<link rel="stylesheet" href="../Style/general-style.css"><script type="module">
	import {HD} from '../Style/header+footer.js'
	HD(1)
</script>
<style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .br-ta {
        width:98%;
        display:grid;
        grid-template-columns: 20% 70%;
        border: 1px solid black;
    }
    .br-ta  br{
        padding-left: 10px;
    }
    .br-ta textarea{
        margin : 10px;
        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .fill{
        height: 100px;

        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .input-latex-div {
        display: grid;
        grid-template-columns: 100%;
        width: 100%;
        padding: 0px;
        margin: 5px;
    }
    .input-latex-div div{
        text-align: center;
    }
    .br-ta-Latex {
        grid-template-columns: 90%;
        text-align : left;
    }
    header {
        text-align: center;
    }
</style>
<body>
<header>
    <h1> Modifier Annonce </h1>
</header>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Id :</br>
        <textarea class="Id c0"></textarea>
    </div>
    <div><button class="Trouver">Trouver</button></div>
</div>
<script type="module" src="./modifierAnnonce.js">
</script>


</body>
</html>

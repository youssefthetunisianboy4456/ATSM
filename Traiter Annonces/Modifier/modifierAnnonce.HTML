<script>

<body>

     <h1>Modifier une annonce</h1>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Id :</br>
        <select class="annonce-select c0"></select>
    </div>
    <div><button class="Trouver" >Trouver</button></div>
</div>
<script type="module">
import { loadAnnonces } from "../../Annonces/annonceList.js";
async function showAnnonces() {
    const select = document.querySelector('.annonce-select');
    const annonces=await loadAnnonces();
    annonces.forEach((annonce) => {
        select.innerHTML += `
            <option value="${annonce.id}">
                ${annonce.mainText}
            </option>
        `;
    });
}
showAnnonces();
document.querySelector('.Trouver').addEventListener('click',  async function()  {
    const annonces=await loadAnnonces();
    const id=document.querySelector('.annonce-select').value
    const annonceTrouvee = annonces.find(news => news.id === id);
    if (id==='' ||!annonceTrouvee) {
        alert('id-invalide')
    } else {
       alert('id-non-invalide')
       window.location.href=`./modifAnnonceT.html?id=${id}`
    }
})
</script>

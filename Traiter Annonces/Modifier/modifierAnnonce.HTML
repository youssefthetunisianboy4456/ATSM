<script>
		function toggleMenu() {
			const menuToggle = document.getElementById("menuToggle");
			const navLinks = document.querySelector(".nav-links");
			navLinks.classList.toggle("active");

			if (navLinks.classList.contains("active")) {
				menuToggle.textContent = "✕";
			} else {
				menuToggle.textContent = "☰";
			}
		};
	</script>
<style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .br-ta {
        width:98%;
        display:grid;
        grid-template-columns: 20% 70%;
        border: 1px solid black;
    }
    .br-ta  br{
        padding-left: 10px;
    }
    .br-ta textarea{
        margin : 10px;
        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .fill{
        height: 100px;

        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .input-latex-div {
        display: grid;
        grid-template-columns: 100%;
        width: 100%;
        padding: 0px;
        margin: 5px;
    }
    .input-latex-div div{
        text-align: center;
    }
    .br-ta-Latex {
        grid-template-columns: 90%;
        text-align : left;
    }
    header {
        text-align: center;
    }
</style>
<body>
<header>
     <h1>Supprimer une annonce</h1>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Id :</br>
        <select class="annonce-select c0"></select>
    </div>
    <div><button class="Trouver" onclick="deleteAnnonce()">Trouver</button></div>
</div>
<script type="module">
import { loadAnnonces } from "../../Annonces/annonceList.js";
async function showAnnonces() {
    const select = document.querySelector('.annonce-select');
    const annonces=await loadAnnonces();
    annonces.forEach((annonce) => {
        select.innerHTML += `
            <option value="${annonce.id}">
                ${annonce.mainText}
            </option>
        `;
    });
}
showAnnonces();
</script>

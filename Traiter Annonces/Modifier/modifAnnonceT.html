<!DOCTYPE html>
<html>
<head>
	<title>Modifier une annonce</title>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
</head>
<link rel="stylesheet" href="../../Style/general-style.css">
<link rel="stylesheet" href="../../Style/traiter-style.css">
<script type="module">
	import {HD} from '../../Style/header+footer.js'
	HD(2)
</script>
<script>
		function toggleMenu() {
			const menuToggle = document.getElementById("menuToggle");
			const navLinks = document.querySelector(".nav-links");
			navLinks.classList.toggle("active");

			if (navLinks.classList.contains("active")) {
				menuToggle.textContent = "✕";

			}

<style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

</style>
<body>
<h1>Modifier annonce Trouvée</h1>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Titre :</br>
        <textarea class="mainText c1" ></textarea>
    </div>
    <div class="br-ta">
        <br>Fichier de l'image :</br>
        <textarea class="iamge c2"></textarea>
    </div>
    <div class="br-ta">
        <br>Commentaire :</br>
        <textarea class="subText c3"></textarea>
    </div>
    <div class="br-ta pressReport-div">
        <br>Texte principal :</br>
        <textarea class="fill pressReport c4" id="fill"></textarea></div>
    <div class="date-type">
        <div class="br-ta pressReport-div">
            <p>Date :</p>
            <input class="fill pressReport c5" id="fill" type="date"></div>
        <div class="br-ta pressReport-div">
            <p>Type :</p>
            <!--<textarea class="fill pressReport c6" id="fill"></textarea></div>-->
            <select class="c6">
                <option value="upcoming">À venir</option>
                <option value="passed">Événement passé</option>
                <option value="competiton">Compétiton</option>
                <option value="stage">Stage de préparation</option>
                <option value="release">Nouveau défi</option>
                <option value="test">Test de sélection</option>
            </select>
        </div>
    </div>
    <div class="br-ta-Latex"><button class="update bt" >Modifier</button></div>
</div>
<!--<script type="module" src="./modifAnnonceT.js">
</script>-->
<script src="../checkToken.js"></script>
<script type="module">
    const requestModif = new URLSearchParams(window.location.search);
    const id = requestModif.get('id');
    import { loadAnnonces } from "../../Annonces/annonceList.js";
    async function fillTextArea() {
        const annonces=await loadAnnonces()
        const annonceTrouvee = annonces.find(news => news.id === id);
        document.querySelector(`.c${1}`).value=annonceTrouvee.mainText
        document.querySelector(`.c${2}`).value=annonceTrouvee.image
        document.querySelector(`.c${3}`).value=annonceTrouvee.subText
        document.querySelector(`.c${4}`).value=annonceTrouvee.pressReport
        document.querySelector(`.c${5}`).value=annonceTrouvee.date
        document.querySelector(`.c${6}`).value=annonceTrouvee.type
    }
    document.querySelector('.update').addEventListener('click' , async function update() {
        let x=['']
        for (let i=1; i<7 ; i++) {
            x[i]=document.querySelector(`.c${i}`).value
        }
        const newAnnonce = {
            mainText : x[1],
            image :x[2],
            subText :x[3],
            pressReport:x[4],
            date : x[5],
            type: x[6]
        }
        const token = sessionStorage.getItem('adminToken');
        const response = await fetch(
            `https://atsm-backend.onrender.com/update/${id}`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify(newAnnonce)
            }
        );
        //location.reload()
        const result=await response.json()
        location.reload()
    })
    fillTextArea();
</script>

</body>
</html>

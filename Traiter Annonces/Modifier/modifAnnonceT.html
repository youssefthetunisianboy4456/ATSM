<html>
<head>

</head>

<script type="module">

	HD(2)
</script>
<script>

<style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .br-ta {
        width:98%;
        display:grid;
        grid-template-columns: 20% 70%;
        border: 1px solid black;
    }
    .br-ta  br{
        padding-left: 10px;
    }
    .br-ta textarea{
        margin : 10px;
        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .fill{
        height: 100px;

        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .input-latex-div {
        display: grid;
        grid-template-columns: 100%;
        width: 100%;
        padding: 0px;
        margin: 5px;
    }
    .input-latex-div div{
        text-align: center;
    }
    .br-ta-Latex {
        grid-template-columns: 90%;
        text-align : left;
    }
    header {
        text-align: center;
    }
</style>
<body>
<h1>Modifier annonce Trouvée</h1>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Titre :</br>
        <textarea class="mainText c1" ></textarea>
    </div>
    <div class="br-ta">
        <br>Fichier de l'image :</br>
        <textarea class="iamge c2"></textarea>
    </div>
    <div class="br-ta">
        <br>Commentaire :</br>
        <textarea class="subText c3"></textarea>
    </div>
    <div class="br-ta pressReport-div">
        <br>Texte principal :</br>
        <textarea class="fill pressReport c4" id="fill"></textarea></div>
    <div class="br-ta pressReport-div">
        <br>Date :</br>
        <textarea class="fill pressReport c5" id="fill"></textarea></div>
    <div class="br-ta pressReport-div">
        <br>Type :</br>
        <textarea class="fill pressReport c6" id="fill"></textarea></div>
    <div class="br-ta-Latex br-ta Latex Preview"></div>
    <div class="br-ta-Latex"><button class="update" >Modifier</button></div>
</div>
<!--<script type="module" src="./modifAnnonceT.js">-->
</script>
<script type="module">
    const requestModif = new URLSearchParams(window.location.search);
    const id = requestModif.get('id');
    import { loadAnnonces } from "../../Annonces/annonceList.js";
    async function fillTextArea() {
        const annonces=await loadAnnonces()
        const annonceTrouvee = annonces.find(news => news.id === id);
        document.querySelector(`.c${1}`).value=annonceTrouvee.mainText
        document.querySelector(`.c${2}`).value=annonceTrouvee.image
        document.querySelector(`.c${3}`).value=annonceTrouvee.subText
        document.querySelector(`.c${4}`).value=annonceTrouvee.pressReport
        document.querySelector(`.c${5}`).value=annonceTrouvee.date
        document.querySelector(`.c${6}`).value=annonceTrouvee.type
    }
    document.querySelector('.update').addEventListener('click' , async function update() {
        let x=['']
        for (let i=1; i<7 ; i++) {
            x[i]=document.querySelector(`.c${i}`).value
        }
        const newAnnonce = {
            mainText : x[1],
            image :x[2],
            subText :x[3],
            pressReport:x[4],
            date : x[5],
            type: x[6]
        }
        const token = sessionStorage.getItem('adminToken');
        const response = await fetch(
            `https://atsm-backend.onrender.com/update/${id}`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify(newAnnonce)
            }
        );
        //location.reload()
        const result=await response.json()
        location.reload()
    })
    fillTextArea();
</script>

</body>
</html>

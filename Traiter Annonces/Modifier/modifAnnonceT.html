<!DOCTYPE html> 
<html>
<head>
	<title>Modifier une annonce</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/4.1.1/spin.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>

</head>
<link rel="stylesheet" href="../../Style/general-style.css">
<link rel="stylesheet" href="../../Style/traiter-style.css">
<script type="module">
	import {HD} from '../../Style/header+footer.js'
	HD(2)
</script>
<script>
		function toggleMenu() {
			const menuToggle = document.getElementById("menuToggle");
			const navLinks = document.querySelector(".nav-links");
			navLinks.classList.toggle("active");

			if (navLinks.classList.contains("active")) {
				menuToggle.textContent = "✕";
			} else {
				menuToggle.textContent = "☰";
			}
		};
	</script>
<style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .modif {
        display: grid;
        transition:
            grid-template-rows 0.4s ease,
            opacity 0.4s ease,
            transform 0.4s ease;
    }
    .modif-content {
        overflow: hidden;
    }
    .modif-hide {
        grid-template-rows: 0fr;
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
    }
    .modif-show {
        grid-template-rows: 1fr;
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }
    .popup-background{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.25);
        backdrop-filter:blur(6px);
        z-index:1000;

        justify-content:center;
        align-items:center;
    }
    .popup-box{
        background:white;
        padding:30px;
        border-radius:15px;
        width:300px;
        align-items:center;
        text-align:center;
    }
    .div-bp{
        display: flex;
        justify-content: space-between;
        gap:10px;
    }
    .div-bp button {
        border: none;
        border-radius: 3px;
        padding: 14px 27px;
        font-size: 14px;
        transition:
            background 0.2s,
            color 0.2s,
            transform 0.2s;
        text-decoration: none;
    }
    .div-bp button:hover {
        transform: translateY(-2px);
    }
    .cancel {
        color: black;
        background-color: none;
    }
    .cancel:hover {
        color: white;
        background-color: black;
    }
    .proceed {
        color: red;
        background-color: white;
    }
    .proceed:hover{
        color:white;
        background-color: red;
    }
    .buttons{
        justify-content: center;
        width:100%;
        display:flex;
        gap: 10px;
    }
    .update{
        color:darkblue;
    }
    .update:hover{
        color:white;
        background-color: darkblue;
    }
    .id-selector{
        display: flex;
        flex-direction: column;
        width: 100%;
        align-items: center;
    }
    .title-line{
        width: 200px;
        height: 3px;
        background-color: darkblue;
    }
    .id-selector p{
        size:10px;
        font-style: italic;
        color: #bbb;
    }
</style>
<body>
<section class="id-selector">
     <h1>Gérer une actualité</h1>
     <p> MODIFIER OU SUPPRIMER </p>
<div class="input-latex-div">
    <div class="br-ta img-selec">
        <p>Sélectionnez l'actualité à gérer :</p>
        <select class="annonce-select c0"></select>
    </div>
</div>
 <div class="title-line"></div>
</section>
<section class="modif modif-hide">
<div class=""modif-content>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Titre :</br>
        <textarea class="mainText c1" ></textarea>
    </div>
    <div class="br-ta img-selec">
        <p>Fichier de l'image :</p>
        <select class="c2"></select>
    </div>
    <div class="br-ta">
        <br>Commentaire :</divbr>
        <textarea class="subText c3"></textarea>
    </div>
    <div class="br-ta pressReport-div">
        <br>Texte principal :</br>
        <textarea class="fill pressReport c4" id="fill"></textarea>
    </div>
    <div class="br-ta pressReport-div">
        <br>Aperçu :</br>
        <div class="get preview c4" id="get"></div>
    </div>
    <div class="date-type">
        <div class="br-ta pressReport-div">
            <p>Date :</p>
            <input class="fill pressReport c5" id="fill" type="date"></div>
        <div class="br-ta pressReport-div">
            <p>Type :</p>
            <!--<textarea class="fill pressReport c6" id="fill"></textarea></div>-->
            <select class="c6">
                <option value="upcoming">À venir</option>
                <option value="passed">Événement passé</option>
                <option value="competiton">Compétiton</option>
                <option value="stage">Stage de préparation</option>
                <option value="release">Nouveau défi</option>
                <option value="test">Test de sélection</option>
            </select>
        </div>
    </div>
    <div class="br-ta-Latex buttons"><button class="bt" onclick="document.getElementById('modifpop').style.display='flex'" >Enregistrer les modifications</button><button class="bt deleter" onclick="document.getElementById('delpop').style.display='flex'">Effacer cette annonce</button></div>
</div>
</div>
</section>
<div class="popup-background " id="delpop">
    <div class="popup-box">
        <h2>Êtes-vous surs d'effacer cette annonce</h2>
        <div class="div-bp">
            <button class="cancel" onclick="document.getElementById('delpop').style.display='none'">Annuler</button>
            <button class="delete proceed tr-button">Effacer</button>
        </div>
    </div>
</div>
<div class="popup-background " id="modifpop">
    <div class="popup-box">
        <h2>Enregistrer les modifications ?</h2>
        <div class="div-bp">
            <button class="cancel" onclick="document.getElementById('modifpop').style.display='none'">Annuler</button>
            <button class="update proceed tr-button">Enregistrer</button>
        </div>
    </div>
</div>
<!--<script type="module" src="./modifAnnonceT.js">
</script>-->
<script src="../checkToken.js"></script>
<script type="module">
    import { loadAnnonces } from "../../Annonces/annonceList.js";
    async function showAnnonces() {
        const select = document.querySelector('.annonce-select');
        const annonces=await loadAnnonces();
        select.innerHTML+="<option selected></option>"
        annonces.forEach((annonce) => {
            select.innerHTML += `
                <option value="${annonce.id}">
                    ${annonce.mainText}
                </option>
            `;
        });
    }
    showAnnonces();
    async function fillTextArea(id) {
        const annonces=await loadAnnonces()
        const annonceTrouvee = annonces.find(news => news.id === id);
        document.querySelector(`.c${1}`).value=annonceTrouvee.mainText
        document.querySelector(`.c${2}`).value=annonceTrouvee.image
        document.querySelector(`.c${3}`).value=annonceTrouvee.subText
        document.querySelector(`.c${4}`).value=annonceTrouvee.pressReport
        document.querySelector(`.c${5}`).value=annonceTrouvee.date
        document.querySelector(`.c${6}`).value=annonceTrouvee.type
    }
    async function fillImages() {
        const token = sessionStorage.getItem('adminToken');
        const response=await fetch(
            'https://atsm-backend.onrender.com/imagesList', 
            {
                method: 'GET',

                headers: {
                    'Authorization': `Bearer ${token}`
                },
            }
        );
        console.log(response)
        const images =await response.json()
        console.log(images)
        images.forEach(image => {
            if (image.name[0]!==".") {
                document.querySelector('.c2').innerHTML+= `
                    <option value="${image.name}">${image.name}</option>
                `
            }});
            document.querySelector('.c2').innerHTML+=`<option value="">Pas d'image</option>`
        }
    async function buildModif(id) {
        await fillImages();
        await fillTextArea(id);
    }
    function closePopup(x){
        document.getElementById(x).style.display="none";
    }
    async function deleteAnnonce(id) {
        const token=sessionStorage.getItem('adminToken')
        const response = await fetch(`https://atsm-backend.onrender.com/delete/${id}`, 
        { method: 'DELETE' ,headers: { 'Authorization': `Bearer ${token}`} });
        const result = await response.json()
        closePopup('delpop')
        location.reload() 
    }
    let id=0
    const idSelec=document.querySelector('.c0')
    const modif=document.querySelector('.modif')
    idSelec.addEventListener('change', async () => {
        id=idSelec.value
        modif.classList.remove("modif-show");
        modif.classList.add("modif-hide");
        await buildModif(id)
        modif.classList.remove("modif-hide");
        modif.classList.add("modif-show");
    })
    document.querySelector('.delete').addEventListener('click', async () => {
        await deleteAnnonce(id)
        location.reload()
    })
    document.querySelector('.update').addEventListener('click' , async function update() {
        let x=['']
        for (let i=1; i<7 ; i++) {
            x[i]=document.querySelector(`.c${i}`).value
        }
        const newAnnonce = {
            mainText : x[1],
            image :x[2],
            subText :x[3],
            pressReport:x[4],
            date : x[5],
            type: x[6]
        }
        const token = sessionStorage.getItem('adminToken');
        const response = await fetch(
            `https://atsm-backend.onrender.com/update/${id}`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify(newAnnonce)
            }
        );
        const result=await response.json()
        closePopup('modifpop')
        location.reload();
    })
</script>
<script>
    const input = document.getElementById("fill");
    const preview = document.getElementById("get");
    document.addEventListener("change", async (event) => {
        if (event.target.id === "fill") {
            const preview = document.getElementById("get");

            MathJax.typesetClear([preview]);

            preview.textContent = event.target.value;

            await MathJax.typesetPromise([preview]);
        } 
});
</script>
</body>
</html>

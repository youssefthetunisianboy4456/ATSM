<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ATSM</title>
</head>
 <style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
</style>
<body>
    
<link rel="stylesheet" href="../../Style/general-style.css">
<link rel="stylesheet" href="../../Style/traiter-style.css">
<script type="module">
	import {HD} from '../../Style/header+footer.js'
	HD(2)
</script>
<script>
    function toggleMenu() {
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.querySelector(".nav-links");
        navLinks.classList.toggle("active");

        if (navLinks.classList.contains("active")) {
            menuToggle.textContent = "✕";
        } else {
            menuToggle.textContent = "☰";
        }
    };
</script>

<body>
<header>
    <h1> Nouvelle Annonce </h1>
</header>
<div class="input-latex-div">
    <div class="id-titre">
        <div class="br-ta">
            <br>Id :</br>
            <textarea class="Id c0"></textarea>
        </div>
        <div class="br-ta">
            <br>Titre :</br>
            <textarea class="mainText c1"></textarea>
        </div>
    </div>
    <div class="br-ta">
        <br>Fichier de l'image :</br>
        <select class="c2"></select>
    </div>
    <div class="br-ta">
        <br>Commentaire :</br>
        <textarea class="subText c3"></textarea>
    </div>
    <div class="br-ta pressReport-div">
        <br>Texte principal :</br>
        <textarea class="fill pressReport c4" id="fill"></textarea></div>
    <div class="date-type">
        <div class="br-ta pressReport-div">
            <p>Date :</p>
            <input class="fill pressReport c5" id="fill" type="date"></div>
        <div class="br-ta pressReport-div">
            <p>Type :</p>
            <!--<textarea class="fill pressReport c6" id="fill"></textarea></div>-->
            <select class="c6">
                <option value="upcoming">À venir</option>
                <option value="passed">Événement passé</option>
                <option value="competiton">Compétiton</option>
                <option value="stage">Stage de préparation</option>
                <option value="release">Nouveau défi</option>
                <option value="test">Test de sélection</option>
            </select>
        </div>
    </div>
    <!--<div class="br-ta-Latex br-ta Latex Preview"></div>-->
    <div class="br-ta-Latex"><button class="add bt" onclick="add()" >Ajouter</button></div>
</div>
<script src="./ajoterAnnonce.js"></script>
<script src="../checkToken.js"></script>
<script>
    async function add() {
        let x=[]
        for (let i=0 ; i<7 ; i++) {
            x[i]=document.querySelector(`.c${i}`).value
        }
        const newAnnonce = {
            id:x[0],
            mainText : x[1],
            image :x[2],
            subText :x[3],
            pressReport:x[4],
            date : x[5],
            type: x[6]
        }
        const token = sessionStorage.getItem('adminToken');
        const response = await fetch(
            'https://atsm-backend.onrender.com/add',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify(newAnnonce)
            }
        );
        const result =await response.json()
        location.reload()
    }
    async function fillImages() {
        const token = sessionStorage.getItem('adminToken');
        const response=await fetch(
            'https://atsm-backend.onrender.com/imagesList', 
            {
                method: 'GET',

                headers: {
                    'Authorization': `Bearer ${token}`
                },
            }
        );
        const images =await response.json()
        images.forEach(image => {
            console.log(image)
            document.querySelector('.c2').innerHTML+= `
                <option value="${image}">${image}</option>
            `
        });
    }
    fillImages();
</script>
</body>
</html>

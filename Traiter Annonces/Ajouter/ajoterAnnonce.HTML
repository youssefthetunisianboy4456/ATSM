<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ATSM</title>
</head>
 <style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .br-ta {
        width:98%;
        display:grid;
        grid-template-columns: 20% 70%;
        border: 1px solid black;
    }
    .br-ta  br{
        padding-left: 10px;
    }
    .br-ta textarea{
        margin : 10px;
        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .fill{
        height: 100px;

        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .input-latex-div {
        display: grid;
        grid-template-columns: 100%;
        width: 100%;
        padding: 0px;
        margin: 5px;
    }
    .input-latex-div div{
        text-align: center;
    }
    .br-ta-Latex {
        grid-template-columns: 90%;
        text-align : left;
    }
    header {
        text-align: center;
    }
</style>
<body>
    <h1>Welcome to the matrix</h1>
    
<link rel="stylesheet" href="../../Style/general-style.css">
<script type="module">
	import {HD} from '../../Style/header+footer.js'
	HD(1)
</script>

<body>
<header>
    <h1> Nouvelle Annonce </h1>
</header>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Id :</br>
        <textarea class="Id c0"></textarea>
    </div>
    <div class="br-ta">
        <br>Titre :</br>
        <textarea class="mainText c1"></textarea>
    </div>
    <div class="br-ta">
        <br>Fichier de l'image :</br>
        <textarea class="iamge c2"></textarea>
    </div>
    <div class="br-ta">
        <br>Commentaire :</br>
        <textarea class="subText c3"></textarea>
    </div>
    <div class="br-ta pressReport-div">
        <br>Texte principal :</br>
        <textarea class="fill pressReport c4" id="fill"></textarea></div>
    <div class="br-ta pressReport-div">
        <br>Date :</br>
        <textarea class="fill pressReport c5" id="fill"></textarea></div>
    <div class="br-ta pressReport-div">
        <br>Type :</br>
        <textarea class="fill pressReport c6" id="fill"></textarea></div>
    <div class="br-ta-Latex br-ta Latex Preview"></div>
    <div class="br-ta-Latex"><button class="add" onclick="add()" >Ajouter</button></div>
</div>
<script src="./ajoterAnnonce.js"></script>
<script src="../checkToken.js"></script>
<script>
    async function add() {
        let x=[]
        for (let i=0 ; i<7 ; i++) {
            x[i]=document.querySelector(`.c${i}`).value
        }
        const newAnnonce = {
            id:x[0],
            mainText : x[1],
            image :x[2],
            subText :x[3],
            pressReport:x[4],
            date : x[5],
            type: x[6]
        }
        const token = sessionStorage.getItem('adminToken');
        await fetch(
            'https://atsm-backend.onrender.com/add',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify(newAnnonce)
            }
        );
    }
</script>
</body>
</html>

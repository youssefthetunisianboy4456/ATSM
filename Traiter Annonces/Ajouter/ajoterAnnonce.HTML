    <script>
window.MathJax = {
    loader: {
        load: [
            '[tex]/html',
            '[tex]/mathtools',
            '[tex]/color',
            '[tex]/physics',
            '[tex]/cancel',
            '[tex]/centernot',
            '[tex]/cases',
            '[tex]/empheq',
            '[tex]/bbm',
            '[tex]/dsfont',
            '[tex]/braket'
        ]
    },

    tex: {
        packages: {
            '[+]': [
                'html',
                'mathtools',
                'color',
                'physics',
                'cancel',
                'centernot',
                'cases',
                'empheq',
                'bbm',
                'dsfont',
                'braket'
            ]
        },

        inlineMath: [
            ['$', '$'],
            ['\\(', '\\)']
        ],

        displayMath: [
            ['$$', '$$'],
            ['\\[', '\\]']
        ],

        macros: {
            NN: '\\mathbb{N}',
            ZZ: '\\mathbb{Z}',
            QQ: '\\mathbb{Q}',
            RR: '\\mathbb{R}',
            CC: '\\mathbb{C}',

            abs: ['\\left|#1\\right|', 1],
            norm: ['\\left\\lVert#1\\right\\rVert', 1],
            floor: ['\\left\\lfloor#1\\right\\rfloor', 1],
            ceil: ['\\left\\lceil#1\\right\\rceil', 1],

            seg: ['\\overline{#1}', 1],
            ray: ['\\overrightarrow{#1}', 1],
            ang: ['\\angle #1', 1],
            dang: ['\\measuredangle #1', 1]
        }
    },

    output: {
        displayOverflow: 'linebreak',

        linebreaks: {
            width: '100%'
        }
    }
};
</script>

<script>
    async function add() {
        let x=[]
        for (let i=0 ; i<7 ; i++) {
            x[i]=document.querySelector(`.c${i}`).value
        }
        const newAnnonce = {
            id:x[0],
            mainText : x[1],
            image :x[2],
            subText :x[3],
            pressReport:x[4],
            date : x[5],
            type: x[6]
        }
        const token = sessionStorage.getItem('adminToken');
        const response = await fetch(
            'https://atsm-backend.onrender.com/add',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify(newAnnonce)
            }
        );
        const result =await response.json()
        location.reload()
    }
    async function fillImages() {
        const token = sessionStorage.getItem('adminToken');
        const response=await fetch(
            'https://atsm-backend.onrender.com/imagesList', 
            {
                method: 'GET',

                headers: {
                    'Authorization': `Bearer ${token}`
                },
            }
        );
        console.log(response)
        const images =await response.json()
        console.log(images)
            images.forEach(image => {
            if (image.name[0]!==".") {
                document.querySelector('.c2').innerHTML+= `
                    <option value="${image.name}">${image.name}</option>
                `
            }});
            document.querySelector('.c2').innerHTML+=`<option value="">Pas d'image</option>`
        }
    fillImages();
</script>
<script type="module" >
    import {splitter} from "../../print_long/splitterLatTikz.js"
    let input = document.getElementById("fill");
    let preview = document.getElementById("get");
    document.addEventListener("input", async (event) => {
        if (event.target.id === "fill") {
            splitter(input.value,'get','scale=4, transform shape')
        } 
    });
    </script>

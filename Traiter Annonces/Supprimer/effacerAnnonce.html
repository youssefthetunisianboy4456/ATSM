<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ATSM</title>
</head>
 <style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .br-ta {
        width:98%;
        display:grid;
        grid-template-columns: 20% 70%;
        border: 1px solid black;
    }
    .br-ta  br{
        padding-left: 10px;
    }
    .br-ta textarea{
        margin : 10px;
        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .fill{
        height: 100px;

        padding: 8px;
        box-sizing: border-box;

        resize: none;          /* optional: prevents manual resizing */

        white-space: pre-wrap; /* keeps line breaks and allows wrapping */
        overflow-wrap: break-word;

        overflow-y: auto;      /* vertical scroll when needed */
        overflow-x: hidden;    /* no horizontal scrollbar */
    }
    .input-latex-div {
        display: grid;
        grid-template-columns: 100%;
        width: 100%;
        padding: 0px;
        margin: 5px;
    }
    .input-latex-div div{
        text-align: center;
    }
    .br-ta-Latex {
        grid-template-columns: 90%;
        text-align : left;
    }
    header {
        text-align: center;
    }
</style>
<body>
    
<link rel="stylesheet" href="../../Style/general-style.css">
<script type="module">
	import {HD} from '../../Style/header+footer.js'
	HD(1)
</script>

<body>
<div class="input-latex-div">
    <div class="br-ta">
        <br>Id :</br>
        <select class="annonce-select c0"></select>
    </div>
    <div><button class="delete" onclick="deleteAnnonce()">Effacer</button></div>
</div>
<script type="module">
import { loadAnnonces } from "../../Annonces/annonceList.js";
async function showAnnonces() {
    const select = document.querySelector('.annonce-select');
    const annonces=await loadAnnonces();
    annonces.forEach((annonce) => {
        select.innerHTML += `
            <option value="${annonce.id}">
                ${annonce.mainText}
            </option>
        `;
    });
}
showAnnonces();
</script>
    <script src="../checkToken.js">
    </script>
    <script src="./effacerAnnonce.js"></script>
</body>
</html>

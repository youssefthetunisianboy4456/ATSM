 <style>
    body {

        display: flex;

        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;

        margin: 5px 5px 5px 5px;

        width: fit-content;
        height: fit-content;

<script>
    function toggleMenu() {
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.querySelector(".nav-links");
        navLinks.classList.toggle("active");

        if (navLinks.classList.contains("active")) {
            menuToggle.textContent = "✕";
        } else {
            menuToggle.textContent = "☰";
        }
    };
</script>

<body>
<section >
    <div class="ajouterImage"></div>
    <div class="images"></div>
</section>
<!--<script src="../checkToken.js"></script>-->
<script>
    async function showImages() {
        const token = sessionStorage.getItem('adminToken');
        const response=await fetch(
            'https://atsm-backend.onrender.com/imagesList', 
            {
                method: 'GET',

                headers: {
                    'Authorization': `Bearer ${token}`
                },
            }
        );
        console.log(response)
        const images =await response.json()
        console.log(images)
            images.forEach(image => {
            if (image.name[0]!==".") {
                document.querySelector('.images').innerHTML+= `
                <a https://ngbsaqvegvwgqiyslaiz.supabase.co/storage/v1/object/public/atsm-files/Images/${image.name}>
                    <img src='https://ngbsaqvegvwgqiyslaiz.supabase.co/storage/v1/object/public/atsm-files/Images/${image.name}'>
                    <p> ${image.name} </p>
                </a>
                `
            }});
        }
    showImages();
</script>
</body>
</html>

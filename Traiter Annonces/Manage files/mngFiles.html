<!DOCTYPE html> 
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Géstionnaire des fichiers</title>
</head>
 <style>
    body {
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    section{
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
        width:100%;
        height:100%;
    }
    h2{
        margin-left: 5px;
    }
    .actions div{
        display:flex;
        gap: 10px;
        width: 100%;
        height: 50px;
        justify-content: center;
        align-items: center;
    }
    .images {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        align-content: center;
    }
    .images div{
        max-width:100%;
        height: 100%;
        justify-content: center;
    }
    .images div a{
        text-decoration: none;
        width: 100%;
        height: 100%;
        margin: 5px 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 12px 12px rgba(0, 0,0,0);
    }
    .images div a img{
        height: 100px;
        max-width: 100%;
    }
    .images div div{
        display:flex;
        flex-direction: row;
        align-items: center;
        gap : 5px;
    }
    .images div div p{
        font-size: 10px;
        color: #bbb;
    }
    .images div div input{
        cursor: pointer;
    }
    .images div a:hover {
        transform: translateY(-2px);
    }
    .popup-background{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.25);
        backdrop-filter:blur(6px);
        z-index:1000;

        justify-content:center;
        align-items:center;
    }
    .popup-box{
        background:white;
        padding:30px;
        border-radius:15px;
        width:300px;
        align-items:center;
        text-align:center;
    }
    .div-bp{
        display: flex;
        justify-content: space-between;
        gap:10px;
    }
    .div-bp button {
        border: none;
        border-radius: 3px;
        padding: 14px 27px;
        font-size: 14px;
        transition:
            background 0.2s,
            color 0.2s,
            transform 0.2s;
        text-decoration: none;
    }
    .div-bp button:hover {
        transform: translateY(-2px);
    }
    .cancel {
        color: black;
        background-color: none;
    }
    .cancel:hover {
        color: white;
        background-color: black;
    }
    .proceed {
        color: red;
        background-color: white;
    }
    .proceed:hover{
        color:white;
        background-color: red;
    }
</style>
<body>
    
<link rel="stylesheet" href="../../Style/general-style.css">
<link rel="stylesheet" href="../../Style/traiter-style.css">
<script type="module">
	import {HD} from '../../Style/header+footer.js'
	HD(2)
</script>
<script>
    function toggleMenu() {
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.querySelector(".nav-links");
        navLinks.classList.toggle("active");

        if (navLinks.classList.contains("active")) {
            menuToggle.textContent = "✕";
        } else {
            menuToggle.textContent = "☰";
        }
    };
</script>

<body>
<section class="actions">
    <h2>Actions à faire :</h2>
    <div class="ajouterImage">
        Ajouter une image :
        <input type="file" class="imageInput" accept="image/*"> 
        <a class="tr-button" onclick="sendImage()"> Ajouter </a >
    </div>
    <div class="effacerImage">
        <p>Effacer une image : </p>
        <a class="tr-button del" onclick="
            const checkedImages=document.querySelectorAll('.delete:checked')
            if (checkedImages.length===0) {
                alert('Aucune image selectionnée')
            } else {
                document.getElementById('popup').style.display='flex'
            }">Effacer</a>
    </div>
</section>
<section>
    <h2>Toutes les images : </h2>
    <div class="images"></div>
</section>
<div class="popup-background " id="popup">
    <div class="popup-box">
        <h2>Etes-vous surs d'effacer ces images ?</h2>
        <div class="div-bp">
            <button class="cancel" onclick="document.getElementById('popup').style.display='none'">Annuler</button>
            <button class="proceed " onclick="deleteImages()">Effacer</button>
        </div>
    </div>
</div>
<script src="../checkToken.js"></script>
<script>
    async function showImages() {
        const token = sessionStorage.getItem('adminToken');
        const response=await fetch(
            'https://atsm-backend.onrender.com/imagesList', 
            {
                method: 'GET',

                headers: {
                    'Authorization': `Bearer ${token}`
                },
            }
        );
        const images =await response.json()
            images.forEach(image => {
            if (image.name[0]!==".") {
                document.querySelector('.images').innerHTML+= `
                <div>
                    <a href="https://ngbsaqvegvwgqiyslaiz.supabase.co/storage/v1/object/public/atsm-files/Images/${image.name}">
                        <img src='https://ngbsaqvegvwgqiyslaiz.supabase.co/storage/v1/object/public/atsm-files/Images/${image.name}'>
                        <div><p> ${image.name} </p><input class="delete" type="checkbox" value="${image.name}"></div>
                    </a>
                </div>
                `
            }});
        }
    showImages();
</script>
<script>
async function sendImage() {
    const file = document.querySelector('.imageInput').files[0];

    if (!file) {
        alert("Select an image");
        return;
    }

    if (file.size > 500 * 1024) {
        alert("Image must be under 500 KB");
        return;
    }

    const formData = new FormData();

    formData.append("image", file);
    const token=sessionStorage.getItem('adminToken')
    const response = await fetch("https://atsm-backend.onrender.com/uploadImage", {
        method: "POST",
        headers: {'Authorization' : `Bearer ${token}`},
        body: formData
    });

    const result = await response.json();

    console.log(result);
}
async function deleteImages() {
    const checkedImages=document.querySelectorAll('.delete:checked')
    if (checkedImages.length!== 0) {
        const checkedNames=[...checkedImages].map(x => x.innerHTML)
        const token=sessionStorage.getItem('adminToken')
        const response = await fetch("https://atsm-backend.onrender.com/deleteImages", {
            method: "POST",
            headers: {
                'Content-Type' : 'application/json',
                'Authorization' : `Bearer ${token}`
            },
            body: JSON.stringify(checkedNames)
        });
        console.log(response.json())
    } else {
        alert('Aucune image choisie')
    }
}

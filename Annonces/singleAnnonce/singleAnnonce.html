<script>
window.MathJax = {
    loader: {
        load: [
            '[tex]/html',
            '[tex]/mathtools',
            '[tex]/color',
            '[tex]/physics',
            '[tex]/cancel',
            '[tex]/centernot',
            '[tex]/cases',
            '[tex]/empheq',
            '[tex]/bbm',
            '[tex]/dsfont',
            '[tex]/braket'
        ]
    },

    tex: {
        packages: {
            '[+]': [
                'html',
                'mathtools',
                'color',
                'physics',
                'cancel',
                'centernot',
                'cases',
                'empheq',
                'bbm',
                'dsfont',
                'braket'
            ]
        },

        inlineMath: [
            ['$', '$'],
            ['\\(', '\\)']
        ],

        displayMath: [
            ['$$', '$$'],
            ['\\[', '\\]']
        ],

        macros: {
            NN: '\\mathbb{N}',
            ZZ: '\\mathbb{Z}',
            QQ: '\\mathbb{Q}',
            RR: '\\mathbb{R}',
            CC: '\\mathbb{C}',

            abs: ['\\left|#1\\right|', 1],
            norm: ['\\left\\lVert#1\\right\\rVert', 1],
            floor: ['\\left\\lfloor#1\\right\\rfloor', 1],
            ceil: ['\\left\\lceil#1\\right\\rceil', 1],

            seg: ['\\overline{#1}', 1],
            ray: ['\\overrightarrow{#1}', 1],
            ang: ['\\angle #1', 1],
            dang: ['\\measuredangle #1', 1]
        }
    },

    output: {
        displayOverflow: 'linebreak',

        linebreaks: {
            width: '100%'
        }
    }
};
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

<script>
	function toggleMenu() {
		const menuToggle = document.getElementById("menuToggle");
		const navLinks = document.querySelector(".nav-links");
		navLinks.classList.toggle("active");

		if (navLinks.classList.contains("active")) {
			menuToggle.textContent = "✕";
		} else {
			menuToggle.textContent = "☰";
		}
	};
</script>
